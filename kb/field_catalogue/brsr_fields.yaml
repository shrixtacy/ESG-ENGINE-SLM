# ESGPilot — BRSR Field Catalogue (v1)
# Machine-readable specification of BRSR reporting fields.
# This is the most important artifact — drives rules engine, form mapping, retrieval filters.
# Reviewed and maintained by ESG SME.

version: "2024"
framework: "BRSR"
description: "SEBI Business Responsibility and Sustainability Reporting format"

fields:
  # ═══════════════════════════════════════════
  # SECTION A: General Disclosures
  # ═══════════════════════════════════════════

  - id: brsr_a_1_cin
    framework: BRSR
    section: Section A - General Disclosures
    code: A-I-1
    label: Corporate Identity Number (CIN) of the Listed Entity
    field_type: text
    mandatory_for:
      classes: [top_1000, listed]
    validations:
      pattern: "^[A-Z]{1}[0-9]{5}[A-Z]{2}[0-9]{4}[A-Z]{3}[0-9]{6}$"
    refs:
      BRSR: "Section A, I.1"

  - id: brsr_a_1_name
    framework: BRSR
    section: Section A - General Disclosures
    code: A-I-2
    label: Name of the Listed Entity
    field_type: text
    mandatory_for:
      classes: [top_1000, listed]
    refs:
      BRSR: "Section A, I.2"

  - id: brsr_a_1_fy
    framework: BRSR
    section: Section A - General Disclosures
    code: A-I-3
    label: Year of incorporation
    field_type: number
    mandatory_for:
      classes: [top_1000, listed]
    validations:
      min: 1800
      max: 2030
    refs:
      BRSR: "Section A, I.3"

  - id: brsr_a_turnover
    framework: BRSR
    section: Section A - General Disclosures
    code: A-II-1
    label: Turnover (in Rs.)
    unit: INR
    field_type: number
    mandatory_for:
      classes: [top_1000, listed]
    validations:
      min: 0
      non_negative: true
    refs:
      BRSR: "Section A, II.1"

  - id: brsr_a_employees_permanent
    framework: BRSR
    section: Section A - General Disclosures
    code: A-III-1a
    label: Total number of permanent employees
    field_type: number
    mandatory_for:
      classes: [top_1000, listed]
    validations:
      min: 0
      non_negative: true
    refs:
      BRSR: "Section A, III.1"

  - id: brsr_a_employees_contract
    framework: BRSR
    section: Section A - General Disclosures
    code: A-III-1b
    label: Total number of contract/temporary employees
    field_type: number
    mandatory_for:
      classes: [top_1000, listed]
    validations:
      min: 0
      non_negative: true
    refs:
      BRSR: "Section A, III.1"

  - id: brsr_a_employees_total
    framework: BRSR
    section: Section A - General Disclosures
    code: A-III-1c
    label: Total employees (permanent + contract)
    field_type: number
    mandatory_for:
      classes: [top_1000, listed]
    formula: "sum(brsr_a_employees_permanent, brsr_a_employees_contract)"
    validations:
      min: 0
      non_negative: true
    refs:
      BRSR: "Section A, III.1"

