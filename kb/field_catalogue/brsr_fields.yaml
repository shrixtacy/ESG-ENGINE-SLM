  # --- Energy ---
  - id: brsr_p6_ei1_elec_purchased
    framework: BRSR
    section: Section C - Principle 6 - Energy
    code: P6-EI-1a
    label: Total electricity consumption from grid (purchased)
    unit: kWh
    field_type: number
    mandatory_for:
      classes: [top_1000, listed]
    validations:
      min: 0
      non_negative: true
      evidence_required: true
    refs:
      BRSR: "P6 Essential Indicator 1"
      GRI: "302-1"
      SDG: ["7.2", "7.3"]

  - id: brsr_p6_ei1_elec_renewable
