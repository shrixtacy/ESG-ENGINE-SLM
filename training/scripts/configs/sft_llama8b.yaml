# ESGPilot SFT Training Config — Llama-3.1-8B-Instruct
# Usage: python train_lora.py --config configs/sft_llama8b.yaml

model_name: "meta-llama/Llama-3.1-8B-Instruct"
load_in_4bit: true
dtype: "bfloat16"

# LoRA — slightly higher rank for Llama
lora_r: 32
lora_alpha: 64
lora_dropout: 0.05
target_modules:
  - q_proj
  - k_proj
  - v_proj
  - o_proj
  - gate_proj
  - up_proj
  - down_proj

# Training
train_file: "training/data/sft_reviewed.jsonl"
output_dir: "training/checkpoints/llama8b_lora_v1"
num_train_epochs: 3
per_device_train_batch_size: 2   # Llama is larger
gradient_accumulation_steps: 8
learning_rate: 1.5e-4
warmup_ratio: 0.05
lr_scheduler_type: "cosine"
weight_decay: 0.01
max_seq_length: 4096
seed: 42

# Logging
logging_steps: 10
save_steps: 200
eval_steps: 200
report_to: "none"

push_to_hub: false
hub_model_id: ""
