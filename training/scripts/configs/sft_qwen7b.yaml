# ESGPilot SFT Training Config — Qwen2.5-7B-Instruct
# Usage: python train_lora.py --config configs/sft_qwen7b.yaml

model_name: "Qwen/Qwen2.5-7B-Instruct"
load_in_4bit: true
dtype: "bfloat16"

# LoRA
lora_r: 16
lora_alpha: 32
lora_dropout: 0.05
target_modules:
  - q_proj
  - k_proj
  - v_proj
  - o_proj
  - gate_proj
  - up_proj
  - down_proj

# Training
train_file: "training/data/sft_reviewed.jsonl"
output_dir: "training/checkpoints/qwen7b_lora_v1"
num_train_epochs: 3
per_device_train_batch_size: 4
gradient_accumulation_steps: 4
learning_rate: 2.0e-4
warmup_ratio: 0.05
lr_scheduler_type: "cosine"
weight_decay: 0.01
max_seq_length: 4096
seed: 42

# Logging
logging_steps: 10
save_steps: 200
eval_steps: 200
report_to: "none"  # Change to "wandb" if W&B configured

push_to_hub: false
hub_model_id: ""
